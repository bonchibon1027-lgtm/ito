<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07090f"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#0078d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#131922"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1c2535" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#1c2535" stroke-width="1"/>
  <line x1="1" y1="0" x2="1" y2="630" stroke="#1c2535" stroke-width="1"/>
  <line x1="1199" y1="0" x2="1199" y2="630" stroke="#1c2535" stroke-width="1"/>

  <!-- Accent border top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#titleGrad)"/>

  <!-- Card decorations (background) -->
  <rect x="720" y="80" width="140" height="190" rx="16" fill="url(#cardGrad)" stroke="#1c2535" stroke-width="1.5" opacity="0.6"/>
  <rect x="880" y="60" width="140" height="190" rx="16" fill="url(#cardGrad)" stroke="#253045" stroke-width="1.5" opacity="0.8"/>
  <rect x="1040" y="90" width="140" height="190" rx="16" fill="url(#cardGrad)" stroke="#1c2535" stroke-width="1.5" opacity="0.5"/>

  <!-- Card numbers -->
  <text x="790" y="200" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#1c2535" text-anchor="middle">23</text>
  <text x="950" y="180" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#253045" text-anchor="middle">67</text>
  <text x="1110" y="210" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#1c2535" text-anchor="middle">91</text>

  <!-- More cards below -->
  <rect x="740" y="360" width="140" height="190" rx="16" fill="url(#cardGrad)" stroke="#1c2535" stroke-width="1.5" opacity="0.4"/>
  <rect x="900" y="380" width="140" height="190" rx="16" fill="url(#cardGrad)" stroke="#1c2535" stroke-width="1.5" opacity="0.3"/>
  <text x="810" y="475" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#1c2535" text-anchor="middle">42</text>
  <text x="970" y="495" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#1c2535" text-anchor="middle">8</text>

  <!-- Glowing accent circle -->
  <circle cx="600" cy="315" r="280" fill="none" stroke="#0078d4" stroke-width="1" opacity="0.08"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.06"/>

  <!-- Main logo -->
  <text x="160" y="260" font-family="Inter, sans-serif" font-size="140" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)" text-anchor="middle">ITO</text>

  <!-- Japanese subtitle -->
  <text x="160" y="320" font-family="sans-serif" font-size="36" font-weight="400" fill="#4a5568" text-anchor="middle" letter-spacing="8">糸</text>

  <!-- Divider -->
  <line x1="60" y1="355" x2="260" y2="355" stroke="#1c2535" stroke-width="1"/>

  <!-- Description -->
  <text x="160" y="400" font-family="sans-serif" font-size="22" fill="#4a5568" text-anchor="middle">数字で語るカードゲーム</text>

  <!-- Feature tags -->
  <rect x="55" y="440" width="140" height="36" rx="18" fill="#0d1117" stroke="#1c2535" stroke-width="1"/>
  <text x="125" y="463" font-family="sans-serif" font-size="15" fill="#4a5568" text-anchor="middle">オンライン対戦</text>

  <rect x="210" y="440" width="100" height="36" rx="18" fill="#0d1117" stroke="#1c2535" stroke-width="1"/>
  <text x="260" y="463" font-family="sans-serif" font-size="15" fill="#4a5568" text-anchor="middle">最大8人</text>

  <!-- Bottom tagline -->
  <text x="600" y="570" font-family="sans-serif" font-size="20" fill="#253045" text-anchor="middle">ito-2yg4.onrender.com</text>
</svg>
